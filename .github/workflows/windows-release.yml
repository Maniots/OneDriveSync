name: Windows installer and release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build and test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Run regressions
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          .\.venv\Scripts\python.exe -m pytest tests -q --basetemp build/ci-tests -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Prepare official Inno Setup compiler
        run: |
          New-Item -ItemType Directory -Force build/tools | Out-Null
          $download = Join-Path $PWD 'build/tools/innosetup.exe'
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $download
          if ((Get-AuthenticodeSignature -LiteralPath $download).Status -ne 'Valid') { throw 'Invalid compiler signature' }
          $destination = Join-Path $PWD 'build/tools/inno'
          $process = Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/PORTABLE=1','/CURRENTUSER','/NOICONS','/TASKS=',('/DIR="' + $destination + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed' }
      - name: Build installer and update manifest
        run: .\Build-Windows.ps1 -BuildNumber ${{ github.run_number }}
      - name: Validate the actual frozen executable
        run: |
          .\.venv\Scripts\python.exe scripts/verify_windows_bundle.py dist/OneDrivePCSync/OneDrivePCSync.exe
          if ($LASTEXITCODE -ne 0) { throw 'Frozen acceptance checks failed' }
      - name: Validate installer lifecycle
        run: |
          & .\build\tools\inno\ISCC.exe /Qp /DValidationBuild packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Validation installer compilation failed' }
          .\scripts\Verify-WindowsInstaller.ps1
      - name: Upload downloadable Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: EverySync-Windows-Setup-${{ github.run_number }}
          path: |
            dist/installer/EverySync-Setup-*.exe
            dist/installer/OneDrivePCSync-Setup-*.exe
            dist/installer/update.json
            dist/installer/release-notes.md
          if-no-files-found: error
          compression-level: 0
      - name: Publish the current master build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $head = gh api "repos/$env:GH_REPO/commits/master" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read master' }
          if ($head -ne '${{ github.sha }}') { Write-Host 'A newer master commit is pending; skip this outdated build'; exit 0 }
          $tag = 'master-${{ github.run_number }}'
          $manifest = Get-Content dist/installer/update.json -Raw | ConvertFrom-Json
          $installer = Join-Path 'dist/installer' $manifest.installer
          $canonical = Join-Path 'dist/installer' ("EverySync-Setup-$($manifest.version).exe")
          if ((Get-FileHash -LiteralPath $installer).Hash -ne (Get-FileHash -LiteralPath $canonical).Hash) { throw 'Installer compatibility alias differs' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'This build was already published'; exit 0 }
          gh release create $tag "${canonical}#EverySync Windows setup" "${installer}#Compatibility setup for existing installations" dist/installer/update.json --target '${{ github.sha }}' --latest --title "EverySync $($manifest.version)" --notes-file dist/installer/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
